name: AutoEngineer portable offline quality
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-quality:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked application dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Install pinned analyzers and Lua test runtime
        run: python -m pip install --disable-pip-version-check ruff==0.17.1 pyright==1.1.414 lupa==2.8
      - name: Portable quality-gate regression tests
        run: python -B -m unittest tests.test_code_quality_gate tests.test_vscode_problems_gate tests.test_layered_quality tests.test_agent_quality_workflow -q
      - name: Ruff lint
        run: python -m ruff check agent tests memory
      - name: Pyright static typing
        run: pyright
      - name: Git patch hygiene
        run: git diff --check

# The full integration suite requires pinned local Factorio 2.1.23 API meta
# bundles, a staged test profile, and an isolated game/backend. Run the separate
# local layered quality gate for those checks; never mark them as CI-passed here.
